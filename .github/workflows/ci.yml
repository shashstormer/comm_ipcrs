name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CommIPC Server (Python)
        run: pip install git+https://github.com/shashstormer/comm_ipc.git

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Start CommIPC Server
        run: |
          mkdir -p /tmp/comm_ipc
          python -c "import asyncio; from comm_ipc.server import CommIPCServer; asyncio.run(CommIPCServer(socket_path='/tmp/comm_ipc/comm_default.sock').run())" &
          timeout 10s bash -c 'until [ -S /tmp/comm_ipc/comm_default.sock ]; do sleep 1; done'
        env:
          COMM_IPC_SOCKET: /tmp/comm_ipc/comm_default.sock

      - name: Run tests
        run: cargo test --verbose
        env:
          COMM_IPC_SOCKET: /tmp/comm_ipc/comm_default.sock
