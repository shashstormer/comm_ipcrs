name: Publish to Crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CommIPC Server (Python)
        run: pip install git+https://github.com/shashstormer/comm_ipc.git

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Start CommIPC Server
        run: |
          mkdir -p /tmp/comm_ipc
          python -c "import asyncio; from comm_ipc.server import CommIPCServer; asyncio.run(CommIPCServer(socket_path='/tmp/comm_ipc/comm_default.sock').run())" &
          timeout 10s bash -c 'until [ -S /tmp/comm_ipc/comm_default.sock ]; do sleep 1; done'
        env:
          COMM_IPC_SOCKET: /tmp/comm_ipc/comm_default.sock

      - name: Run tests
        run: cargo test --verbose
        env:
          COMM_IPC_SOCKET: /tmp/comm_ipc/comm_default.sock

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
